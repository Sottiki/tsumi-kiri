name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 2つの job は同時に流れる。
# - check：lint とユニットのテスト。すぐ終わるので、失敗したときに早く分かる
# - e2e：ビルドと画面のテスト。ブラウザを入れるのに時間がかかるので、check を待たずに始める
# 全体の時間は、2つの合計ではなく、長い方（e2e）で決まる
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 型の確認もここで行う（npm run build は tsc -b を含む）
      - run: npm run build
      # 画面を出さずに動かすので、ヘッドレス用の Chromium（chromium-headless-shell）だけを入れる。
      # 画面を出す方の Chromium は使わないので、ダウンロードを省く
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
